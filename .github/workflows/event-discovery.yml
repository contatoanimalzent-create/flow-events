name: Event discovery
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/discovery-filters.test.mjs
