name: Public track record
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  real-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/public-track-record.test.mjs
